# Standalone file: never merge with the local docker-compose.yml.
# Always pass -p fourlane-prod -f docker-compose.prod.yml --env-file <server .env>.
services:
  app:
    image: ghcr.io/songstone/four-lane-auction:${IMAGE_TAG:?Select an image tag}
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?Set the server JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set the database user}
      DB_PASSWORD: ${DB_PASSWORD:?Set the database password}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?Set the exact deployment origin}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set a random Base64 signing key of at least 32 bytes}
      ITEM_IMAGE_STORAGE_ROOT: /app/data/images
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-80}:8080"
    volumes:
      - item-images:/app/data/images
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mysql:
    image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set the database name}
      MYSQL_USER: ${DB_USERNAME:?Set the database user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set the database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set the root password}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--innodb-buffer-pool-size=512M"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
  item-images:
