spring:
  application:
    name: four-lane-auction
  profiles:
    default: local
  datasource:
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10000000B
      max-request-size: 101000000B
      file-size-threshold: 0

server:
  tomcat:
    max-swallow-size: -1
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  paths-to-match: /api/**

fourlane:
  image-storage:
    root: ${ITEM_IMAGE_STORAGE_ROOT:./.local-data/images}
  auth:
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    secure-cookie: true
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fourlane_auction}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: ${MYSQL_USER:fourlane}
    password: ${MYSQL_PASSWORD:fourlane_local_password}

server:
  port: ${SERVER_PORT:8080}

fourlane:
  auth:
    secure-cookie: false
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: 127.0.0.1

---
# MVC slices do not open a DB. Integration tests override this with Testcontainers.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://${TEST_MYSQL_HOST:127.0.0.1}:${TEST_MYSQL_PORT:3306}/${TEST_MYSQL_DATABASE:fourlane_auction_test}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${TEST_MYSQL_USER:fourlane}
    password: ${TEST_MYSQL_PASSWORD:fourlane_local_password}

server:
  port: 0

fourlane:
  auth:
    # Public test-only key; never a local/prod fallback.
    jwt-secret-base64: dGVzdC1vbmx5LTMyLWJ5dGUta2V5LTAtMDEyMzQ1Njc4OQ==
    secure-cookie: false
  websocket:
    allowed-origins: http://127.0.0.1:5173

management:
  server:
    port: 0
    address: 127.0.0.1

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

fourlane:
  image-storage:
    root: ${ITEM_IMAGE_STORAGE_ROOT}

server:
  port: ${SERVER_PORT}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT}
    address: ${MANAGEMENT_SERVER_ADDRESS}
