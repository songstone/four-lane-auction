name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Build and test including time-source checks and both time zones
        id: build
        working-directory: backend
        run: ./gradlew --no-daemon clean build --no-build-cache
      - name: Verify and summarize actual test execution
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: python3 .github/scripts/verify-test-results.py
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/*/build/test-results/**/*.xml
            backend/*/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24 and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Build
        run: npm run build
